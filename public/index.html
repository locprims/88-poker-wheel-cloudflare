<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>88 Poker Club — 幸运转盘</title>
  <link rel="stylesheet" href="/static/style.css?v=16-cn-status">
  <style>
    /* Chiffres standards et lisibles dans la fenetre du gain. */
    #win-amount.win-amount {
      font-family: Arial, "Helvetica Neue", sans-serif;
      font-style: normal;
      font-weight: 700;
      font-stretch: normal;
      font-variant-numeric: lining-nums proportional-nums;
      font-feature-settings: "lnum" 1, "tnum" 0;
      letter-spacing: normal;
    }
    .win-credit-message {
      margin: 12px auto 16px;
      max-width: 30ch;
      padding: 0 12px;
      color: #ffe8ad;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: clamp(14px, 3.8vw, 17px);
      font-weight: 400;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <canvas id="celebration" aria-hidden="true"></canvas>
  <div id="win-overlay" class="win-overlay" aria-hidden="true">
    <div class="win-card">
      <div class="win-crown">♛</div>
      <div class="win-cn">恭喜中奖！</div>
      <div id="win-amount" class="win-amount">88 $</div>
      <p class="win-credit-message">您的奖金将很快存入您的扑克账户。</p>
      <div id="win-label" class="win-label">★ 88 POKER CLUB ★</div>
    </div>
  </div>
  <main class="app">
    <img class="logo" src="/static/88-poker-logo.png" alt="88 Poker Club">
    <div class="eyebrow">88 POKER CLUB</div>
    <h1 class="wheel-heading">幸运转盘</h1>
    <div class="status-panel" id="status-panel" data-state="loading">
      <span class="status-icon" aria-hidden="true">✓</span>
      <div class="status-copy">
        <span class="status-caption">抽奖资格 · 88 POKER CLUB</span>
        <p id="status" class="subtitle" aria-live="polite">正在验证您的抽奖资格…</p>
      </div>
    </div>
   <section class="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheel" width="900" height="900"></canvas>
  <button id="spin" class="spin" type="button" disabled>抽奖</button>
</section>

<div id="result" class="result" aria-live="polite"></div>

<p style="
  margin: 18px auto;
  padding: 14px 18px;
  max-width: 420px;
  border: 1px solid #d4af37;
  border-radius: 12px;
  background: #211a0d;
  color: #ffe8ad;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.7;
  text-align: center;
">
  您的奖金将于近期发放至您的 88 Poker Club 玩家账户。
</p>

<p class="note">抽奖机会需经 88 Poker Club 审核后方可使用。</p>
</main>

<script src="/static/app.js?v=20-gain-cn"></script>
</body>
</html>
